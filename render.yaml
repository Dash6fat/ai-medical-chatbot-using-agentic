services:
  - type: web
    name: venkanna-oleti-medical-chatbot
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: CHATBOT_PERSIST_HISTORY
        value: "false"
      - key: CHATBOT_DB_PATH
        value: /tmp/chat_history.sqlite3
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: VOSK_MODEL_PATH
        value: /opt/chatbot/models/vosk-model-small-en-us-0.15
